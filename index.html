<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platoon No. 1 - Personnel Directory</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0b132b;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 2.3rem;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
      border-bottom: 2px solid #38bdf8;
      padding-bottom: 8px;
      display: inline-block;
    }

    header p {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 1rem;
    }

    /* Grid layout for folders */
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 40px;
    }

    /* Folder Card */
    .folder-card {
      background: #1c2541;
      border: 1px solid #3a506b;
      border-radius: 10px;
      padding: 20px 15px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .folder-card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 8px 18px rgba(56, 189, 248, 0.25);
      background: #243256;
    }

    /* Serial Number Badge */
    .serial-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #38bdf8;
      color: #0b132b;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .folder-icon {
      font-size: 2.8rem;
      margin: 10px 0 8px;
      display: block;
    }

    .folder-name {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      word-break: break-word;
      text-transform: uppercase;
    }

    /* Content Area */
    .content-box {
      width: 100%;
      max-width: 1200px;
      background: #1c2541;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      padding: 25px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .content-box h2 {
      color: #38bdf8;
      margin-bottom: 10px;
      border-bottom: 1px solid #3a506b;
      padding-bottom: 8px;
      font-size: 1.4rem;
    }

    .content-box p {
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .content-box ul {
      list-style-type: none;
    }

    /* Clickable sub-items */
    .content-box li {
      padding: 12px 16px;
      background: #0b132b;
      border-radius: 6px;
      margin-bottom: 10px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #3a506b;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .content-box li:hover {
      background: #162238;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Detail View Container */
    .detail-view {
      margin-top: 20px;
      padding: 20px;
      background: #0b132b;
      border-radius: 8px;
      border: 1px dashed #38bdf8;
      display: none;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Platoon No. 1</h1>
    <p>पर्सनल रिकॉर्ड्स और डॉक्युमेंट फ़ोल्डर्स</p>
  </header>

  <!-- Folders Grid -->
  <main class="folder-grid" id="folderContainer"></main>

  <!-- Selected Folder Content View -->
  <section id="contentArea" class="content-box">
    <h2 id="folderTitle">फ़ोल्डर का नाम</h2>
    <p id="folderDesc">विवरण यहाँ दिखेगा...</p>
    
    <ul id="fileList">
      <li onclick="openGfLink()">🔗 1. GIRLFRIENDS (Click to Open Link)</li>
      <li onclick="showSubDetail('addiction')">📄 2. TYPE OF ADDICTION</li>
      <li onclick="showSubDetail('character')">📄 3. CHARACTER IDENTIFICATION</li>
      <li onclick="showSubDetail('diet')">🪪 4. DIET</li>
    </ul>

    <!-- Sub detail display -->
    <div id="detailView" class="detail-view"></div>
  </section>

  <script>
    const membersList = [
      "PROBIR", "SAMEER", "GAUTAM", "MUKESH", "AMIT (D)", "RANJIT", "RAMBABU", 
      "SUBHAJYOTI", "SRIKANTH", "SAI PRAKASH", "ANKIT", "RANJIT", "RAMBABU", 
      "SUBHAJYOTI", "SRIKANTH", "SAI PRAKASH", "ANKIT", "JAI PRAKASH", "RAJENDRA", 
      "MAHESH", "RITIK", "AMIT KUMAR", "AMIT MANI", "RAKESH", "SWARAJIT", 
      "ASHIK", "ABDUL", "SOUGATA", "BISHU", "GAUTAM", "CHANDAN", "DIPAK", 
      "PAWAN", "SHIVANSHU", "ARIHANT", "LAKKAPPA"
    ];

    let currentMember = "";
    const container = document.getElementById('folderContainer');

    membersList.forEach((name, index) => {
      const serialNo = String(index + 1).padStart(2, '0');

      const card = document.createElement('div');
      card.className = 'folder-card';
      card.onclick = () => openFolder(serialNo, name);

      card.innerHTML = `
        <span class="serial-badge">#${serialNo}</span>
        <div class="folder-icon">📁</div>
        <div class="folder-name">${name}</div>
      `;

      container.appendChild(card);
    });

    function openFolder(slNo, name) {
      currentMember = name;
      const contentArea = document.getElementById('contentArea');
      const folderTitle = document.getElementById('folderTitle');
      const folderDesc = document.getElementById('folderDesc');
      const detailView = document.getElementById('detailView');

      detailView.style.display = 'none';
      folderTitle.innerText = `[#${slNo}] - फ़ोल्डर: ${name}`;
      folderDesc.innerText = `Platoon No. 1 ke jawan ${name} ke details dekhne ke liye category chunein:`;

      contentArea.style.display = "block";
      contentArea.scrollIntoView({ behavior: 'smooth' });
    }

    // 1. GIRLFRIENDS par click hote hi link open hoga
    function openGfLink() {
      window.open('https://share.google/hDv4NktK5WFhoLTiz', '_blank');
    }

    function showSubDetail(type) {
      const detailView = document.getElementById('detailView');
      detailView.style.display = 'block';

      if (type === 'addiction') {
        detailView.innerHTML = `
          <h3 style="color: #38bdf8; margin-bottom: 8px;">2. TYPE OF ADDICTION - ${currentMember}</h3>
          <p style="color: #cbd5e1;">Chai, Canteen Snacks, aur Gaming/Social media checking.</p>
        `;
      } else if (type === 'character') {
        detailView.innerHTML = `
          <h3 style="color: #38bdf8; margin-bottom: 8px;">3. CHARACTER IDENTIFICATION - ${currentMember}</h3>
          <p style="color: #cbd5e1;">Anushasit, mehnati aur platoon ke active member.</p>
        `;
      } else if (type === 'diet') {
        detailView.innerHTML = `
          <h3 style="color: #38bdf8; margin-bottom: 8px;">4. DIET - ${currentMember}</h3>
          <p style="color: #cbd5e1;">Mess Regular Diet + High Protein aur Chana.</p>
        `;
      }
      detailView.scrollIntoView({ behavior: 'smooth' });
    }
  </script>

</body>
</html>
