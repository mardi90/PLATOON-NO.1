<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platoon No. 1 - Directory</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0b132b;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 2.3rem;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
      border-bottom: 2px solid #38bdf8;
      padding-bottom: 8px;
      display: inline-block;
    }

    header p {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 1rem;
    }

    /* Grid layout for 30 folders */
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 40px;
    }

    /* Folder Card */
    .folder-card {
      background: #1c2541;
      border: 1px solid #3a506b;
      border-radius: 10px;
      padding: 20px 15px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .folder-card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 8px 18px rgba(56, 189, 248, 0.25);
      background: #243256;
    }

    /* Serial Number Badge */
    .serial-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #38bdf8;
      color: #0b132b;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .folder-icon {
      font-size: 2.8rem;
      margin: 10px 0 8px;
      display: block;
    }

    .folder-name {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      word-break: break-word;
    }

    /* Content Area */
    .content-box {
      width: 100%;
      max-width: 1100px;
      background: #1c2541;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      padding: 25px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .content-box h2 {
      color: #38bdf8;
      margin-bottom: 10px;
      border-bottom: 1px solid #3a506b;
      padding-bottom: 8px;
      font-size: 1.4rem;
    }

    .content-box p {
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .content-box ul {
      list-style-type: none;
    }

    .content-box li {
      padding: 10px 14px;
      background: #0b132b;
      border-radius: 6px;
      margin-bottom: 8px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #3a506b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Platoon No. 1</h1>
    <p>30 पर्सनल रिकॉर्ड्स और डॉक्युमेंट फ़ोल्डर्स</p>
  </header>

  <!-- 30 Folders Grid (JavaScript ke jariye automatically load hoga) -->
  <main class="folder-grid" id="folderContainer"></main>

  <!-- Selected Folder Content View -->
  <section id="contentArea" class="content-box">
    <h2 id="folderTitle">फ़ोल्डर का नाम</h2>
    <p id="folderDesc">विवरण यहाँ दिखेगा...</p>
    <ul id="fileList"></ul>
  </section>

  <script>
    // 1 se 30 tak ki list
    // Agar aapke paas baki bando ke naam hain toh niche 'MEMBER 4' ki jagah unke naam daal sakte hain
    const membersList = [
      "PROBIR",
      "SAMEER",
      "GAUTAM",
      "MEMBER 04", "MEMBER 05", "MEMBER 06", "MEMBER 07", "MEMBER 08", "MEMBER 09", "MEMBER 10",
      "MEMBER 11", "MEMBER 12", "MEMBER 13", "MEMBER 14", "MEMBER 15", "MEMBER 16", "MEMBER 17",
      "MEMBER 18", "MEMBER 19", "MEMBER 20", "MEMBER 21", "MEMBER 22", "MEMBER 23", "MEMBER 24",
      "MEMBER 25", "MEMBER 26", "MEMBER 27", "MEMBER 28", "MEMBER 29", "MEMBER 30"
    ];

    const container = document.getElementById('folderContainer');

    // 1 se 30 tak clickable folders banaye jaa rahe hain
    membersList.forEach((name, index) => {
      const serialNo = String(index + 1).padStart(2, '0'); // 01, 02, ... 30

      const card = document.createElement('div');
      card.className = 'folder-card';
      card.onclick = () => openFolder(serialNo, name);

      card.innerHTML = `
        <span class="serial-badge">#${serialNo}</span>
        <div class="folder-icon">📁</div>
        <div class="folder-name">${name}</div>
      `;

      container.appendChild(card);
    });

    // Folder click function
    function openFolder(slNo, name) {
      const contentArea = document.getElementById('contentArea');
      const folderTitle = document.getElementById('folderTitle');
      const folderDesc = document.getElementById('folderDesc');
      const fileList = document.getElementById('fileList');

      folderTitle.innerText = `[#${slNo}] - फ़ोल्डर: ${name}`;
      folderDesc.innerText = `Platoon No. 1 के जवान ${name} के सुरक्षित दस्तावेज़ और फ़ाइलें:`;

      // Demo files list
      fileList.innerHTML = `
        <li>📄 डोसियर & सर्विस बुक (Service Book).pdf</li>
        <li>📄 ड्यूटी रोस्टर & अटेंडेंस रिकॉर्ड.pdf</li>
        <li>📄 वेपन / इक्विपमेंट इशू कार्ड.docx</li>
        <li>🪪 पहचान पत्र & मेडिकल फिटनेस प्रमाण-पत्र.pdf</li>
      `;

      contentArea.style.display = "block";
      contentArea.scrollIntoView({ behavior: 'smooth' });
    }
  </script>

</body>
</html>
